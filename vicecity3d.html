<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vice City 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial,sans-serif}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:18px;text-shadow:0 0 3px #000;opacity:0.7}
#topLeft{position:absolute;top:16px;left:16px;color:#ffe;text-shadow:1px 1px 3px #000;font-size:13px;line-height:1.6}
#wanted{position:absolute;top:16px;right:16px;font-size:22px;color:#ff0;text-shadow:0 0 8px #f80}
#enterPrompt{position:absolute;top:62%;left:50%;transform:translateX(-50%);color:#ff0;font-size:15px;background:rgba(0,0,0,0.5);padding:4px 12px;border-radius:4px;display:none}
#controls{position:absolute;bottom:12px;left:12px;color:#aaa;font-size:11px;line-height:1.7}
#mmCanvas{position:absolute;bottom:16px;right:16px;border:2px solid #ff69b4;border-radius:50%}
#health{width:120px;height:10px;background:#555;border-radius:5px;margin-top:4px;overflow:hidden}
#healthBar{height:100%;background:#0f0;border-radius:5px;transition:width 0.3s}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a0a1a,#1a0a2a,#2a0a1a);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:10}
#overlay h1{font-size:56px;color:#ff69b4;text-shadow:0 0 30px #ff69b4,0 0 60px #ff006688;letter-spacing:8px;margin-bottom:8px}
#overlay .sub{font-size:22px;color:#00ffff;text-shadow:0 0 15px #00ffff;margin-bottom:30px;letter-spacing:4px}
#overlay .start{font-size:16px;color:#fff;animation:pulse 1.5s infinite}
#overlay .keys{margin-top:20px;color:#aaa;font-size:13px;line-height:2}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div id="overlay">
  <h1>VICE CITY</h1>
  <div class="sub">3 D</div>
  <div class="start">▶ Click to Play</div>
  <div class="keys">
    WASD / Arrows — Move &nbsp;|&nbsp; Mouse — Look &nbsp;|&nbsp; Shift — Run<br>
    F — Enter / Exit Car &nbsp;|&nbsp; Space — Jump / Brake &nbsp;|&nbsp; ESC — Unlock Mouse
  </div>
</div>
<div id="hud">
  <div id="crosshair">+</div>
  <div id="topLeft">
    <div id="modeLabel">ON FOOT</div>
    <div id="speedLabel">Speed: 0 km/h</div>
    <div id="health"><div id="healthBar" style="width:100%"></div></div>
    <div style="margin-top:2px;font-size:11px;color:#aaa">HP</div>
  </div>
  <div id="wanted"></div>
  <div id="enterPrompt">Press F to enter vehicle</div>
  <div id="controls">
    WASD Move &nbsp; Shift Run &nbsp; Space Jump/Brake<br>
    F Enter/Exit Car &nbsp; Mouse Look &nbsp; ESC Unlock
  </div>
  <canvas id="mmCanvas" width="160" height="160"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ── RENDERER ──
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.body.appendChild(renderer.domElement);

// ── SCENE ──
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x5bc8f5);
scene.fog = new THREE.Fog(0x87ceeb, 160, 450);

// ── CAMERA ──
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 700);
scene.add(camera);

window.addEventListener('resize', ()=>{
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});

// ── LIGHTS ──
scene.add(new THREE.AmbientLight(0xfff8e7, 0.45));
scene.add(new THREE.HemisphereLight(0x87ceeb, 0xd4a96a, 0.35));
const sun = new THREE.DirectionalLight(0xfff0c0, 1.6);
sun.position.set(80, 150, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 600;
sun.shadow.camera.left = sun.shadow.camera.bottom = -280;
sun.shadow.camera.right = sun.shadow.camera.top = 280;
scene.add(sun);

// ── INPUT ──
const keys = {};
const mouse = {dx:0, dy:0};
let pointerLocked = false;
document.addEventListener('keydown', e=>{ keys[e.code]=true; e.preventDefault(); });
document.addEventListener('keyup',   e=>{ keys[e.code]=false; });
document.addEventListener('mousemove', e=>{ if(pointerLocked){ mouse.dx+=e.movementX; mouse.dy+=e.movementY; } });
document.addEventListener('pointerlockchange', ()=>{ pointerLocked=!!document.pointerLockElement; });

// ── STATE ──
const G = {
  yaw: 0, pitch: -0.25, camDist: 9,
  mode: 'foot',
  speed: 0, health: 100, wanted: 0, wantedTimer: 0,
  nearCar: null, currentCar: null,
};
const player = {
  pos: new THREE.Vector3(8, 1, 5),
  vel: new THREE.Vector3(),
  onGround: true, mesh: null,
};
const cars = [];
const npcs = [];
const collidables = [];

// ── HELPERS ──
function mkBox(w,h,d,mat,x,y,z,cast,recv){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  if(cast)m.castShadow=true;
  if(recv)m.receiveShadow=true;
  scene.add(m); return m;
}
function addAABB(x,z,w,d){ collidables.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2}); }
function collides(x,z,r){
  for(const c of collidables){
    if(x+r>c.minX&&x-r<c.maxX&&z+r>c.minZ&&z-r<c.maxZ) return true;
  }
  return false;
}

// ── MAP ──
function buildMap(){
  // Ground
  mkBox(600,0.2,600,new THREE.MeshLambertMaterial({color:0xc8a86a}),0,-0.1,0,false,true).receiveShadow=true;

  // Beach
  mkBox(340,0.15,55,new THREE.MeshLambertMaterial({color:0xf5e07a}),0,0.02,-82,false,true);

  // Ocean
  mkBox(700,1,250,new THREE.MeshLambertMaterial({color:0x0077bb,transparent:true,opacity:0.82}),0,0,-205,false,false);

  // Shallow water strip
  mkBox(700,0.1,20,new THREE.MeshLambertMaterial({color:0x00aadd,transparent:true,opacity:0.6}),0,0.1,-107,false,false);

  // Sky gradient bands (behind mountains of fog)
  const skyBand = mkBox(700,60,1,new THREE.MeshBasicMaterial({color:0xffa560,side:THREE.BackSide}),0,30,-350);

  // Roads E-W
  [-50,-18,14,46,78].forEach(z=>{
    mkBox(240,0.18,13,new THREE.MeshLambertMaterial({color:0x252525}),0,0.07,z,false,true).receiveShadow=true;
    mkBox(240,0.02,0.4,new THREE.MeshBasicMaterial({color:0xffee00}),0,0.11,z);
    mkBox(240,0.02,0.15,new THREE.MeshBasicMaterial({color:0xffffff}),0,0.11,z-3.5);
    mkBox(240,0.02,0.15,new THREE.MeshBasicMaterial({color:0xffffff}),0,0.11,z+3.5);
  });
  // Roads N-S
  [-96,-64,-32,0,32,64,96].forEach(x=>{
    mkBox(13,0.18,180,new THREE.MeshLambertMaterial({color:0x252525}),x,0.07,14,false,true).receiveShadow=true;
    mkBox(0.4,0.02,180,new THREE.MeshBasicMaterial({color:0xffee00}),x,0.11,14);
  });
  // Sidewalks
  [-50,-18,14,46,78].forEach(z=>{
    mkBox(240,0.22,3.5,new THREE.MeshLambertMaterial({color:0xbcaa96}),0,0.11,z-8.3);
    mkBox(240,0.22,3.5,new THREE.MeshLambertMaterial({color:0xbcaa96}),0,0.11,z+8.3);
  });

  // Buildings (Vice City art deco pastel hotels)
  [
    // [x, z, w, d, h, color]
    [-78,-32,22,16,38,0xffe4b0], [-56,-32,18,14,26,0xff9daa], [-34,-32,18,14,44,0xc8f0ff],
    [-12,-32,18,14,30,0xffd700], [ 10,-32,18,14,40,0xff87c0], [ 32,-32,18,14,28,0x90ee90],
    [ 54,-32,20,16,46,0xffeaaa], [ 76,-32,18,14,32,0xbbd0ff], [ 98,-32,18,14,36,0xffb880],

    [-80,  0,22,18,58,0xffd700], [-56,  0,20,16,42,0xff6b9d], [-32,  0,20,16,52,0x98d8c8],
    [ -8,  0,20,16,48,0xffe4b5], [ 18,  0,20,16,62,0xffa07a], [ 44,  0,20,16,50,0x90ee90],
    [ 70,  0,20,16,37,0x87ceeb], [ 96,  0,18,14,26,0xffccaa],

    [-78, 32,24,20,32,0xfff0c0], [-52, 32,22,18,44,0xffaacc], [-26, 32,22,18,38,0xd0f8c0],
    [  0, 32,22,18,28,0xffdead], [ 26, 32,22,18,46,0xb0d0ff], [ 52, 32,22,18,40,0xffc0a0],
    [ 78, 32,22,18,34,0xffee88], [ 98, 32,20,16,24,0xd0c8ff],

    [-78, 64,26,22,28,0xfff5b0], [-50, 64,24,20,36,0xffb6c1], [-20, 64,24,20,32,0xc0ffee],
    [ 10, 64,24,20,30,0xffe4b5], [ 40, 64,24,20,34,0xffd700], [ 70, 64,24,20,26,0xff9d9d],
    [ 96, 64,20,16,20,0xb8e8ff],

    // Big landmark towers
    [-90, 22,26,24,74,0xffd700], // gold tower
    [ 90, 22,26,24,68,0xff6b9d], // pink tower
    [-40, 78,34,28,22,0xd4edda], // large flat mall
    [ 30, 78,30,26,18,0xfaebd7],
  ].forEach(([x,z,w,d,h,c])=>createBuilding(x,z,w,d,h,c));

  // Palms on beach
  for(let x=-130;x<=130;x+=15){
    palmTree(x, -62+Math.sin(x*0.3)*3);
    if(Math.abs(x%30)<5) palmTree(x+6,-69);
  }
  // Palms along main road
  for(let x=-100;x<=100;x+=22){ palmTree(x,-43); palmTree(x,-8); }
  for(let z=-40;z<=70;z+=25){ palmTree(-102,z); palmTree(102,z); }

  // Lamp posts
  [-50,-18,14,46,78].forEach(z=>{
    for(let x=-100;x<=100;x+=28){ lampPost(x,z-9); lampPost(x,z+9); }
  });

  // Player mesh
  const pg = new THREE.Group();
  const bm = new THREE.MeshLambertMaterial({color:0x1a5276});
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.72,1.15,0.48),bm); body.position.y=0.8; pg.add(body);
  const hm = new THREE.MeshLambertMaterial({color:0xf0c090});
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.52,0.50),hm); head.position.y=1.57; pg.add(head);
  const lm = new THREE.MeshLambertMaterial({color:0x1a2a3a});
  [-0.19,0.19].forEach(lx=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.7,0.3),lm); leg.position.set(lx,0.05,0); pg.add(leg);
  });
  pg.castShadow=true;
  scene.add(pg);
  player.mesh=pg;

  // Spawn drivable cars near player
  spawnCar( 15,0, 4,0xff2200,false);
  spawnCar(-15,0, 4,0x2255ff,false);
  spawnCar( 35,0,-50,0xffcc00,false);

  // NPC cars
  const ncols=[0x888888,0x00aa44,0xcc5500,0xaa00cc,0x00ccaa,0x884422,0x228844,0x44aacc];
  [
    {x:-40,z:-50,r:0.0},{x:40,z:-50,r:Math.PI},{x:80,z:-18,r:Math.PI},
    {x:-80,z:-18,r:0.0},{x:0,z:14,r:Math.PI/2},{x:0,z:46,r:-Math.PI/2},
    {x:-64,z:14,r:0.0},{x:64,z:14,r:Math.PI},
    {x:30,z:-50,r:Math.PI},{x:-60,z:46,r:0},
  ].forEach(({x,z,r},i)=>{
    const c=spawnCar(x,0,z,ncols[i%ncols.length],true);
    c.mesh.rotation.y=r;
    c.npcSpeed=8+Math.random()*6;
    c.npcTurnTimer=2+Math.random()*3;
  });

  // NPCs
  const pcolors=[0xff69b4,0xffd700,0x90ee90,0x87ceeb,0xff6347,0x9b59b6,0xe67e22,0x1abc9c];
  [
    {x:-80,z:-43},{x:-55,z:-43},{x:-30,z:-43},{x:10,z:-43},{x:40,z:-43},{x:70,z:-43},{x:90,z:-43},
    {x:-70,z:-11},{x:50,z:-11},{x:0,z:-11},{x:-40,z:22},{x:60,z:22},{x:20,z:22},
    {x:-90,z:22},{x:90,z:22},
  ].forEach(({x,z},i)=>createNPC(x,z,pcolors[i%pcolors.length]));
}

function createBuilding(x,z,w,d,h,color){
  const mat=new THREE.MeshLambertMaterial({color});
  mkBox(w,h,d,mat,x,h/2,z,true,true);
  mkBox(w-2,1.5,d-2,new THREE.MeshLambertMaterial({color:0xddddcc}),x,h+0.75,z,false,false);
  addAABB(x,z,w+0.6,d+0.6);

  const wm=new THREE.MeshBasicMaterial({color:0xaaddff,transparent:true,opacity:0.55});
  const floors=Math.floor(h/5);
  for(let f=1;f<floors;f++){
    [-w/3,w/3].forEach(ox=>{
      const wn=new THREE.Mesh(new THREE.PlaneGeometry(2.8,2),wm);
      wn.position.set(x+ox,f*5+2,z+d/2+0.06); scene.add(wn);
      const wb=new THREE.Mesh(new THREE.PlaneGeometry(2.8,2),wm);
      wb.position.set(x+ox,f*5+2,z-d/2-0.06); wb.rotation.y=Math.PI; scene.add(wb);
    });
  }
  if(Math.random()>0.55){
    const sc=[0xff0077,0x00ffff,0xffdd00,0xff5500][Math.floor(Math.random()*4)];
    mkBox(w-4,0.8,0.3,new THREE.MeshBasicMaterial({color:sc}),x,h*0.55+2,z+d/2+0.22);
    mkBox(w-4,0.8,0.3,new THREE.MeshBasicMaterial({color:sc}),x,h*0.55+2,z-d/2-0.22);
  }
}

function palmTree(x,z){
  const tm=new THREE.MeshLambertMaterial({color:0x8b7555});
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.28,7,7),tm);
  trunk.position.set(x,3.5,z);
  trunk.rotation.z=(Math.random()-0.5)*0.25;
  trunk.castShadow=true; scene.add(trunk);
  const lm=new THREE.MeshLambertMaterial({color:0x2a8a2a,side:THREE.DoubleSide});
  for(let i=0;i<7;i++){
    const a=(i/7)*Math.PI*2;
    const leaf=new THREE.Mesh(new THREE.PlaneGeometry(4.5,1.1),lm);
    leaf.position.set(x+Math.cos(a)*2,7.8,z+Math.sin(a)*2);
    leaf.rotation.y=a; leaf.rotation.z=0.45;
    leaf.castShadow=true; scene.add(leaf);
  }
  const cm=new THREE.MeshLambertMaterial({color:0x4a2800});
  for(let i=0;i<3;i++){
    const a=(i/3)*Math.PI*2;
    const co=new THREE.Mesh(new THREE.SphereGeometry(0.22,6,5),cm);
    co.position.set(x+Math.cos(a)*0.6,7.2,z+Math.sin(a)*0.6); scene.add(co);
  }
}

function lampPost(x,z){
  const m=new THREE.MeshLambertMaterial({color:0x707070});
  mkBox(0.14,6,0.14,m,x,3,z);
  mkBox(2.2,0.14,0.14,m,x+1.0,6.2,z);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(0.28,8,7),new THREE.MeshBasicMaterial({color:0xffffcc}));
  ball.position.set(x+2.1,6.2,z); scene.add(ball);
  const pl=new THREE.PointLight(0xffffaa,0.55,28); pl.position.set(x+2.1,6,z); scene.add(pl);
}

// ── VEHICLES ──
function spawnCar(x,y,z,color,isNPC){
  const g=new THREE.Group(); g.position.set(x,0.72,z);
  const bm=new THREE.MeshLambertMaterial({color});
  const body=new THREE.Mesh(new THREE.BoxGeometry(4.2,1.15,2.1),bm); body.castShadow=true; g.add(body);

  const dc=new THREE.Color(color); dc.multiplyScalar(0.8);
  const rm=new THREE.MeshLambertMaterial({color:dc});
  const roof=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.95,1.9),rm);
  roof.position.set(-0.25,1.07,0); roof.castShadow=true; g.add(roof);

  const gm=new THREE.MeshLambertMaterial({color:0x88bbff,transparent:true,opacity:0.45});
  [[2.0,1.07,0,0.07,0.85,1.9],[0,1.07,1.0,2.6,0.85,0.07],[-2.8,1.07,0,0.07,0.85,1.9]].forEach(([px,py,pz,w,h,d])=>{
    const wn=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),gm); wn.position.set(px,py,pz); g.add(wn);
  });

  const wm=new THREE.MeshLambertMaterial({color:0x111111});
  const wr=new THREE.MeshLambertMaterial({color:0xd0d0d0});
  [[1.5,-0.38,1.1],[1.5,-0.38,-1.1],[-1.5,-0.38,1.1],[-1.5,-0.38,-1.1]].forEach(([wx,wy,wz])=>{
    const wh=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,0.38,11),wm);
    wh.rotation.z=Math.PI/2; wh.position.set(wx,wy,wz); g.add(wh);
    const ri=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.4,6),wr);
    ri.rotation.z=Math.PI/2; ri.position.set(wx,wy,wz); g.add(ri);
  });

  const lm=new THREE.MeshBasicMaterial({color:0xffffcc});
  [[2.1,-0.1,0.67],[2.1,-0.1,-0.67]].forEach(([px,py,pz])=>{
    const l=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.32,0.42),lm); l.position.set(px,py,pz); g.add(l);
  });
  const tm2=new THREE.MeshBasicMaterial({color:0xff2200});
  [[-2.1,-0.1,0.67],[-2.1,-0.1,-0.67]].forEach(([px,py,pz])=>{
    const l=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.28,0.36),tm2); l.position.set(px,py,pz); g.add(l);
  });

  // Number plate
  mkBoxGrp(g,0.7,0.25,0.05,new THREE.MeshBasicMaterial({color:0xffff99}),2.15,-0.38,0);

  scene.add(g);
  const co={mesh:g,speed:0,npc:isNPC,npcSpeed:10,npcTurnTimer:2,driven:false,color};
  cars.push(co); return co;
}
function mkBoxGrp(g,w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); g.add(m);
}

// ── NPCS ──
function createNPC(x,z,color){
  const g=new THREE.Group(); g.position.set(x,0,z);
  const bm=new THREE.MeshLambertMaterial({color});
  const bd=new THREE.Mesh(new THREE.BoxGeometry(0.52,0.92,0.38),bm); bd.position.y=0.76; g.add(bd);
  const hm=new THREE.MeshLambertMaterial({color:0xf0c090});
  const hd=new THREE.Mesh(new THREE.BoxGeometry(0.40,0.40,0.40),hm); hd.position.y=1.42; g.add(hd);
  const dc=new THREE.Color(color); dc.multiplyScalar(0.55);
  const lm2=new THREE.MeshLambertMaterial({color:dc});
  const l1=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.6,0.28),lm2); l1.position.set(-0.14,0.08,0); g.add(l1);
  const l2=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.6,0.28),lm2); l2.position.set( 0.14,0.08,0); g.add(l2);
  scene.add(g);
  npcs.push({mesh:g,dir:Math.random()*Math.PI*2,speed:1.5+Math.random()*1.2,timer:Math.random()*4,hx:x,hz:z,l1,l2});
}

// ── ENTER / EXIT ──
function enterCar(car){
  G.mode='car'; G.currentCar=car; car.driven=true; car.npc=false;
  player.mesh.visible=false;
  document.getElementById('modeLabel').textContent='IN CAR';
}
function exitCar(){
  const car=G.currentCar;
  G.mode='foot'; G.currentCar=null; car.driven=false; car.speed=0;
  const ex=car.mesh.position.x+Math.sin(car.mesh.rotation.y+Math.PI/2)*3.5;
  const ez=car.mesh.position.z+Math.cos(car.mesh.rotation.y+Math.PI/2)*3.5;
  player.pos.set(ex,1,ez);
  player.mesh.position.copy(player.pos);
  player.mesh.visible=true;
  document.getElementById('modeLabel').textContent='ON FOOT';
}

// ── ONE-SHOT KEY ──
let prevF=false;
function handleFKey(){
  const f=keys['KeyF'];
  if(f&&!prevF){
    if(G.mode==='foot'&&G.nearCar) enterCar(G.nearCar);
    else if(G.mode==='car') exitCar();
  }
  prevF=f;
}

// ── UPDATE ──
let lastTS=0;
function update(ts){
  requestAnimationFrame(update);
  const dt=Math.min((ts-lastTS)/1000,0.05); lastTS=ts;

  // Mouse look
  G.yaw  -=mouse.dx*0.0022;
  G.pitch -=mouse.dy*0.0022;
  G.pitch=Math.max(-0.55,Math.min(0.45,G.pitch));
  mouse.dx=mouse.dy=0;

  handleFKey();

  if(G.mode==='foot') updateFoot(dt);
  else                updateCar(dt);

  cars.forEach(c=>{ if(c.npc&&!c.driven) updateNPCCar(c,dt); });
  npcs.forEach(n=>updateNPC(n,dt));
  checkNearCar();
  updateCamera();

  // Wanted decay
  if(G.wanted>0){ G.wantedTimer+=dt; if(G.wantedTimer>12){G.wanted--;G.wantedTimer=0;} }

  drawHUD();
  renderer.render(scene,camera);
}

function updateFoot(dt){
  const run=keys['ShiftLeft']||keys['ShiftRight'];
  const spd=run?8.5:4.5;
  const dx=(keys['KeyD']||keys['ArrowRight']?1:0)-(keys['KeyA']||keys['ArrowLeft']?1:0);
  const dz=(keys['KeyS']||keys['ArrowDown'] ?1:0)-(keys['KeyW']||keys['ArrowUp']   ?1:0);
  if(dx||dz){
    const ang=G.yaw+Math.atan2(dx,dz);
    const nx=player.pos.x+Math.sin(ang)*spd*dt;
    const nz=player.pos.z+Math.cos(ang)*spd*dt;
    if(!collides(nx,player.pos.z,0.45)) player.pos.x=nx;
    if(!collides(player.pos.x,nz,0.45)) player.pos.z=nz;
    player.mesh.rotation.y=-ang;
    player.mesh.position.y=player.pos.y+Math.sin(ts*0.013)*0.06;
  } else {
    player.mesh.position.y=player.pos.y;
  }
  if(keys['Space']&&player.onGround){ player.vel.y=6.2; player.onGround=false; }
  if(!player.onGround){
    player.vel.y-=16*dt; player.pos.y+=player.vel.y*dt;
    if(player.pos.y<=1){ player.pos.y=1; player.vel.y=0; player.onGround=true; }
  }
  player.pos.x=Math.max(-145,Math.min(145,player.pos.x));
  player.pos.z=Math.max(-62, Math.min(105,player.pos.z));
  player.mesh.position.x=player.pos.x;
  player.mesh.position.z=player.pos.z;
  G.speed=0;
}

let ts=0;
function updateCar(dt){
  const car=G.currentCar; if(!car) return;
  const fwd=(keys['KeyW']||keys['ArrowUp'])?1:((keys['KeyS']||keys['ArrowDown'])?-0.6:0);
  const str=(keys['KeyA']||keys['ArrowLeft']?1:0)-(keys['KeyD']||keys['ArrowRight']?1:0);
  if(keys['Space']) car.speed*=0.83;
  else car.speed+=fwd*22*dt;
  car.speed=Math.max(-12,Math.min(40,car.speed));
  if(!fwd) car.speed*=0.96;
  if(Math.abs(car.speed)<0.08) car.speed=0;
  if(Math.abs(car.speed)>0.4) car.mesh.rotation.y+=str*1.9*dt*Math.sign(car.speed);

  const vx=Math.sin(car.mesh.rotation.y)*car.speed*dt;
  const vz=Math.cos(car.mesh.rotation.y)*car.speed*dt;
  const nx=car.mesh.position.x+vx, nz=car.mesh.position.z+vz;

  if(nx>-145&&nx<145) car.mesh.position.x=nx; else car.speed*=-0.4;
  if(nz>-62 &&nz<105) car.mesh.position.z=nz; else car.speed*=-0.4;

  if(collides(nx,car.mesh.position.z,2.3)){car.mesh.position.x-=vx;car.speed*=-0.35;G.wanted=Math.min(6,G.wanted+1);G.wantedTimer=0;}
  if(collides(car.mesh.position.x,nz,2.3)){car.mesh.position.z-=vz;car.speed*=-0.35;}

  player.pos.set(car.mesh.position.x,1,car.mesh.position.z);
  G.speed=Math.abs(car.speed*3.6)|0;
}

function updateNPCCar(car,dt){
  car.npcTurnTimer-=dt;
  if(car.npcTurnTimer<0){
    car.mesh.rotation.y+=(Math.random()>0.5?1:-1)*Math.PI/2;
    car.npcTurnTimer=2+Math.random()*4;
  }
  const vx=Math.sin(car.mesh.rotation.y)*car.npcSpeed*dt;
  const vz=Math.cos(car.mesh.rotation.y)*car.npcSpeed*dt;
  let nx=car.mesh.position.x+vx, nz=car.mesh.position.z+vz;
  if(nx<-130||nx>130){car.mesh.rotation.y+=Math.PI;nx=Math.max(-130,Math.min(130,nx));}
  if(nz<-55 ||nz>95) {car.mesh.rotation.y+=Math.PI;nz=Math.max(-55, Math.min(95,nz));}
  car.mesh.position.x=nx; car.mesh.position.z=nz;
}

function updateNPC(n,dt){
  n.timer+=dt;
  if(n.timer>3+Math.random()*3){ n.dir+=(Math.random()-0.5)*2; n.timer=0; }
  const nx=n.mesh.position.x+Math.sin(n.dir)*n.speed*dt;
  const nz=n.mesh.position.z+Math.cos(n.dir)*n.speed*dt;
  const dx=nx-n.hx, dz=nz-n.hz;
  if(dx*dx+dz*dz>900) n.dir=Math.atan2(-dx,-dz);
  n.mesh.position.x=Math.max(-145,Math.min(145,nx));
  n.mesh.position.z=Math.max(-60, Math.min(105,nz));
  n.mesh.rotation.y=-n.dir+Math.PI;
  const t=performance.now()*0.008;
  n.l1.position.y=0.08+Math.sin(t+n.hx)*0.1;
  n.l2.position.y=0.08-Math.sin(t+n.hx)*0.1;
  ts=t; // share time var
}

function updateCamera(){
  const tp=G.mode==='car'?G.currentCar.mesh.position:player.pos;
  const cy2=Math.cos(G.pitch), sy=Math.sin(G.pitch);
  const cx=tp.x-Math.sin(G.yaw)*G.camDist*cy2;
  const cy=tp.y + G.camDist*sy + 2.2;
  const cz=tp.z-Math.cos(G.yaw)*G.camDist*cy2;
  camera.position.set(cx,Math.max(tp.y+0.5,cy),cz);
  camera.lookAt(tp.x,tp.y+1.6,tp.z);
}

function checkNearCar(){
  if(G.mode!=='foot'){ G.nearCar=null; document.getElementById('enterPrompt').style.display='none'; return; }
  G.nearCar=null; let md=4.5;
  cars.forEach(c=>{
    if(c.driven) return;
    const dx=player.pos.x-c.mesh.position.x, dz=player.pos.z-c.mesh.position.z;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d<md){md=d;G.nearCar=c;}
  });
  document.getElementById('enterPrompt').style.display=G.nearCar?'block':'none';
}

// ── HUD / MINIMAP ──
const mmCtx=document.getElementById('mmCanvas').getContext('2d');
function drawHUD(){
  document.getElementById('speedLabel').textContent=`Speed: ${G.speed} km/h`;
  document.getElementById('healthBar').style.width=G.health+'%';
  document.getElementById('healthBar').style.background=G.health>50?'#0f0':G.health>25?'#fa0':'#f00';

  let ws=''; for(let i=0;i<G.wanted;i++) ws+='★'; for(let i=G.wanted;i<6;i++) ws+='☆';
  document.getElementById('wanted').textContent=ws;

  // Minimap
  const mc=mmCtx, sz=160, r=78, cx=80, cy=80;
  mc.clearRect(0,0,sz,sz);
  mc.save(); mc.beginPath(); mc.arc(cx,cy,r,0,Math.PI*2); mc.clip();
  mc.fillStyle='#1a1a2e'; mc.fillRect(0,0,sz,sz);

  const sc=sz/320;
  mc.fillStyle='#0077bb'; mc.fillRect(0,0,sz,cy+(-60)*sc+r); // ocean
  mc.fillStyle='#f5e07a'; mc.fillRect(0,cy+(-100)*sc+r,sz,((-60)-(-100))*sc); // beach

  mc.fillStyle='#333';
  [-50,-18,14,46,78].forEach(z=>{ const py=cy+z*sc; mc.fillRect(0,py-3,sz,6); });
  [-96,-64,-32,0,32,64,96].forEach(x=>{ const px=cx+x*sc; mc.fillRect(px-3,0,6,sz); });

  mc.fillStyle='rgba(120,100,70,0.7)';
  collidables.forEach(c=>{
    mc.fillRect(cx+c.minX*sc,cy+c.minZ*sc,(c.maxX-c.minX)*sc,(c.maxZ-c.minZ)*sc);
  });

  mc.fillStyle='#aaa';
  cars.forEach(c=>{ if(c.driven) return; mc.fillRect(cx+c.mesh.position.x*sc-1,cy+c.mesh.position.z*sc-1,4,3); });

  const pp=G.mode==='car'?G.currentCar.mesh.position:player.pos;
  mc.fillStyle='#ff2200';
  mc.beginPath(); mc.arc(cx+pp.x*sc,cy+pp.z*sc,4,0,Math.PI*2); mc.fill();

  // North indicator
  mc.fillStyle='#fff'; mc.font='bold 11px Arial'; mc.textAlign='center';
  mc.fillText('N',cx,cy-r+14);

  mc.restore();
}

// ── INIT ──
buildMap();

document.getElementById('overlay').addEventListener('click',()=>{
  document.getElementById('overlay').style.display='none';
  document.getElementById('hud').style.display='block';
  renderer.domElement.requestPointerLock();
});

requestAnimationFrame(update);
</script>
